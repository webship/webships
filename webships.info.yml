name: Webships
type: profile
description: 'The Webships installer: choose an API site template built with recipes. It enables no modules of its own; the site template you choose decides what the site has.'
core_version_requirement: ^11.4 || ^12
package: Webships

# Use the `distribution` key to skip the installer's profile selection step.
distribution:
  name: Webships
  install:
    # The installer pages use Claro, like the core installer. Default Admin
    # preloads its font from a path under /core/install.php/, which boots a
    # regular Drupal kernel in the middle of the install and leaves stale
    # configuration and container caches behind.
    theme: claro

# Explicitly provide an empty list of themes -- this prevents the installer from
# injecting Stark into it.
# @see install_profile_info()
themes: []
